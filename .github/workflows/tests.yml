name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHP Tests (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, curl, bcmath, gmp, intl, sodium, gd, exif, zip, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Copy environment file
        run: cp .env.example .env

      # myra/framework lives in a private GitHub repo. Provide a token (PAT with
      # read access, stored as the COMPOSER_TOKEN secret) so Composer can fetch
      # it. No-op if the secret is absent or the package repo is made public.
      # NB: the `secrets` context cannot be used in `if:`, so guard in shell.
      - name: Configure Composer auth for private packages
        env:
          COMPOSER_TOKEN: ${{ secrets.COMPOSER_TOKEN }}
        run: |
          if [ -n "$COMPOSER_TOKEN" ]; then
            composer config --global github-oauth.github.com "$COMPOSER_TOKEN"
          fi

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PHPUnit
        run: php artisan test

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build assets
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  audit:
    name: Dependency Audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Composer audit
        run: composer audit || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit
        run: npm audit --omit=dev || true
