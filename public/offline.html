<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 1.5rem; background: #ffffff; color: #09090b;
    font-family: Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 26rem; text-align: center; }
  .dot { width: .625rem; height: .625rem; border-radius: 9999px; background: #a1a1aa; display: inline-block; margin-right: .5rem; }
  h1 { font-size: 1.25rem; line-height: 1.75rem; margin: 0 0 .5rem; font-weight: 600; }
  p { margin: 0 0 1.25rem; font-size: .875rem; line-height: 1.5rem; color: #52525b; }
  button {
    font: inherit; font-size: .875rem; font-weight: 500; cursor: pointer;
    padding: .5rem 1rem; border-radius: .5rem; border: 1px solid #e4e4e7;
    background: #09090b; color: #fafafa;
  }
  button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  @media (prefers-color-scheme: dark) {
    body { background: #09090b; color: #fafafa; }
    p { color: #a1a1aa; }
    button { background: #fafafa; color: #09090b; border-color: #27272a; }
  }
</style>
</head>
<body>
<main role="status">
  <h1><span class="dot" aria-hidden="true"></span>You are offline</h1>
  <p>This page is part of the cached app shell. No account data is stored offline, so nothing can be shown until the connection returns.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
